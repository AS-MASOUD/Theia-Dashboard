<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bannerGrad)" />
  <circle cx="200" cy="100" r="250" fill="url(#accentGrad)" filter="blur(40px)" />
  <circle cx="1000" cy="300" r="200" fill="url(#accentGrad)" filter="blur(30px)" />
</svg>
